.campo{margin-bottom:var(--space-3)}

<script>
"use strict";

/* ===================================================================
   Configuração
=================================================================== */
var SUPABASE_URL = "https://inlkyyjqfrokohdgfswd.supabase.co";
var SUPABASE_KEY = "sb_publishable_Jy_Htveu81VI0-WGwJlO_g_lieqPAZT";
var TABELAS = ["fin_contas","fin_cartoes","fin_categorias","fin_subcategorias",
               "fin_recorrencias","fin_faturas","fin_lancamentos","fin_anexos"];
var BALDE = "fin-anexos";
var MAX_ANEXO = 10 * 1024 * 1024;   // 10 MB por arquivo
var USAR_MOCK = /(\?|&)mock=1/.test(location.search);

/* ===================================================================
   Utilidades
=================================================================== */
var $ = function(s,r){ return (r||document).querySelector(s); };
var $$ = function(s,r){ return [].slice.call((r||document).querySelectorAll(s)); };
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function uid(){ return (crypto.randomUUID ? crypto.randomUUID()
  : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,function(c){
      var r=Math.random()*16|0, v=c==="x"?r:(r&0x3|0x8); return v.toString(16); })); }

var fBRL = new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
var fNum = new Intl.NumberFormat("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
/* Modo discreto: esconde todo valor em dinheiro da tela */
var OCULTO = (function(){ try{ return localStorage.getItem("fin.ocultar")==="1"; }catch(e){ return false; } })();
function BRL(v){ return OCULTO ? "R$ ••••" : fBRL.format(Number(v)||0); }
function N2(v){ return fNum.format(Number(v)||0); }
function PCT(v){ return (Number(v)||0).toFixed(1).replace(".",",")+"%"; }

function hoje(){ var d=new Date(); return iso(d); }
function iso(d){ return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate()); }
function p2(n){ return String(n).padStart(2,"0"); }
function dBR(s){ if(!s) return "—"; var p=String(s).slice(0,10).split("-"); return p[2]+"/"+p[1]+"/"+p[0]; }
function ym(s){ return String(s).slice(0,7); }
function mesBR(s){
  var m=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
  var p=String(s).split("-"); return m[+p[1]-1]+"/"+p[0];
}
function addMeses(dataIso, n){
  var p = String(dataIso).slice(0,10).split("-").map(Number);
  var ano=p[0], mes=p[1]-1+n, dia=p[2];
  var d = new Date(ano, mes, 1);
  var ultimo = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  d.setDate(Math.min(dia, ultimo));
  return iso(d);
}
function diaNoMes(ano, mes /*1-12*/, dia){
  var ultimo = new Date(ano, mes, 0).getDate();
  return ano+"-"+p2(mes)+"-"+p2(Math.min(dia, ultimo));
}
function cent(v){ return Math.round((Number(v)||0)*100); }
function doCent(c){ return c/100; }

/* ===================================================================
   Camada de dados — Supabase ou simulação local (para teste)
=================================================================== */
function apiSupabase(sb){
  function checar(r){ if(r.error) throw new Error(r.error.message||"erro no banco"); return r.data; }
  return {
    modo:"supabase",
    async listar(t){ return checar(await sb.from(t).select("*")); },
    async inserir(t, linhas){
      var arr = Array.isArray(linhas)?linhas:[linhas];
      return checar(await sb.from(t).insert(arr).select());
    },
    async atualizar(t, id, campos){ return checar(await sb.from(t).update(campos).eq("id",id).select()); },
    async apagar(t, id){ return checar(await sb.from(t).delete().eq("id",id)); },
    async apagarExemplos(t){ return checar(await sb.from(t).delete().eq("exemplo",true)); },

    /* arquivos: balde privado, uma pasta por usuário */
    async enviarArquivo(caminho, arquivo){
      var r = await sb.storage.from(BALDE).upload(caminho, arquivo, { upsert:false });
      if(r.error) throw new Error(r.error.message||"não consegui enviar o arquivo");
      return caminho;
    },
    async linkArquivo(caminho){
      var r = await sb.storage.from(BALDE).createSignedUrl(caminho, 120);
      if(r.error) throw new Error(r.error.message||"não consegui abrir o arquivo");
      return r.data.signedUrl;
    },
    async apagarArquivo(caminho){ await sb.storage.from(BALDE).remove([caminho]); },
    pasta(){ return (sessao && sessao.user ? sessao.user.id : "anon"); }
  };
}

function apiMock(){
  var CH = "fin.mock.v1";
  var dados = {}, arquivos = {};
  try { dados = JSON.parse(localStorage.getItem(CH)||"{}"); } catch(e){ dados = {}; }
  TABELAS.forEach(function(t){ if(!dados[t]) dados[t]=[]; });
  function salvar(){ try{ localStorage.setItem(CH, JSON.stringify(dados)); }catch(e){} }
  return {
    modo:"mock",
    async listar(t){ return dados[t].slice(); },
    async inserir(t, linhas){
      var arr = (Array.isArray(linhas)?linhas:[linhas]).map(function(o){
        var n = Object.assign({ id: uid(), criado_em: new Date().toISOString(), exemplo:false }, o);
        return n;
      });
      dados[t] = dados[t].concat(arr); salvar(); return arr;
    },
    async atualizar(t, id, campos){
      dados[t] = dados[t].map(function(r){ return r.id===id ? Object.assign({}, r, campos) : r; });
      salvar(); return dados[t].filter(function(r){ return r.id===id; });
    },
    async apagar(t, id){ dados[t] = dados[t].filter(function(r){ return r.id!==id; }); salvar(); },
    async apagarExemplos(t){ dados[t] = dados[t].filter(function(r){ return !r.exemplo; }); salvar(); },

    /* arquivos só na memória desta aba — o modo de teste não guarda nada */
    async enviarArquivo(caminho, arquivo){ arquivos[caminho] = arquivo; return caminho; },
    async linkArquivo(caminho){
      var a = arquivos[caminho];
      if(!a) throw new Error("arquivo só existe enquanto a aba fica aberta (modo de teste)");
      return URL.createObjectURL(a);
    },
    async apagarArquivo(caminho){ delete arquivos[caminho]; },
    pasta(){ return "teste"; }
  };
}

/* ===================================================================
   Estado
=================================================================== */
var API = null, sb = null, sessao = null;
var D = { contas:[], cartoes:[], categorias:[], subcategorias:[], recorrencias:[], faturas:[], lancamentos:[], anexos:[] };
var estado = {
  view: "painel",
  mes: ym(hoje()),
  // começa no mês corrente para a lista não abrir com um ano de parcelas futuras
  filtros: { de: ym(hoje())+"-01", ate: fimDoMes(ym(hoje())), status:"", categoria:"", forma:"", tipo:"" },
  cartaoFatura: null, competenciaFatura: null, contaExtrato: null
};
function fimDoMes(m){
  var a=+m.slice(0,4), s=+m.slice(5,7);
  return diaNoMes(a, s, 31);
}

/* ===================================================================
   Regras de negócio
=================================================================== */

/* Em que fatura cai uma compra feita em `data` no cartão `c`. */
function faturaDaCompra(c, data){
  var p = String(data).slice(0,10).split("-").map(Number);
  var ano=p[0], mes=p[1], dia=p[2];
  // fecha neste mês se a compra veio até o dia do fechamento
  var mesFech = (dia <= c.dia_fechamento) ? mes : mes+1;
  var anoFech = ano;
  if(mesFech > 12){ mesFech -= 12; anoFech += 1; }
  var fechamento = diaNoMes(anoFech, mesFech, c.dia_fechamento);
  // vence no mesmo mês do fechamento se o dia de vencimento vier depois; senão no mês seguinte
  var mesVenc = anoFech, dv;
  if(c.dia_vencimento > c.dia_fechamento){
    dv = diaNoMes(anoFech, mesFech, c.dia_vencimento);
  } else {
    var mv = mesFech+1, av = anoFech;
    if(mv > 12){ mv -= 12; av += 1; }
    dv = diaNoMes(av, mv, c.dia_vencimento);
  }
  return { fechamento: fechamento, vencimento: dv, competencia: ym(dv) };
}

/* Fatura seguinte (usada nas parcelas) */
function faturaSeguinte(c, competencia, n){
  var base = competencia+"-01";
  var venc = addMeses(base, n);
  var p = venc.split("-").map(Number);
  var vencimento = diaNoMes(p[0], p[1], c.dia_vencimento);
  // fechamento correspondente
  var mf = p[1], af = p[0];
  if(!(c.dia_vencimento > c.dia_fechamento)){ mf = p[1]-1; if(mf<1){ mf=12; af-=1; } }
  return { fechamento: diaNoMes(af, mf, c.dia_fechamento), vencimento: vencimento, competencia: ym(vencimento) };
}

/* Divide em parcelas sem perder centavos */
function dividirParcelas(valor, n){
  var total = cent(valor), base = Math.floor(total/n), resto = total - base*n, out = [];
  for(var i=0;i<n;i++) out.push(doCent(base + (i < resto ? 1 : 0)));
  return out;
}

function conta(id){ return D.contas.filter(function(c){return c.id===id;})[0]; }
function cartao(id){ return D.cartoes.filter(function(c){return c.id===id;})[0]; }
function categoria(id){ return D.categorias.filter(function(c){return c.id===id;})[0]; }
function subcategoria(id){ return D.subcategorias.filter(function(c){return c.id===id;})[0]; }
function fatura(id){ return D.faturas.filter(function(f){return f.id===id;})[0]; }

/* ---- anexos ----
   Numa compra parcelada o arquivo vale para a compra toda: as parcelas
   irmãs mostram o mesmo anexo. */
function irmaosDe(l){
  if(!l) return [];
  if(l.compra_id) return D.lancamentos.filter(function(x){ return x.compra_id===l.compra_id; });
  return [l];
}
function anexosDe(l){
  var ids = irmaosDe(l).map(function(x){ return x.id; });
  return D.anexos.filter(function(a){ return ids.indexOf(a.lancamento_id) >= 0; });
}
function tamanhoArquivo(b){
  b = Number(b)||0;
  if(b < 1024) return b+" B";
  if(b < 1024*1024) return (b/1024).toFixed(0)+" KB";
  return (b/1024/1024).toFixed(1).replace(".",",")+" MB";
}
function nomeSeguro(nome){
  return String(nome||"arquivo").normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[^\w.\- ]+/g,"_").replace(/\s+/g,"_").slice(-80);
}
async function enviarAnexos(lanc, arquivos){
  var novos = [];
  for(var i=0;i<arquivos.length;i++){
    var f = arquivos[i];
    if(f.size > MAX_ANEXO)
      falha('O arquivo "'+f.name+'" tem '+tamanhoArquivo(f.size)+'. O limite é 10 MB.');
    var caminho = API.pasta()+"/"+lanc.id+"/"+uid()+"-"+nomeSeguro(f.name);
    await API.enviarArquivo(caminho, f);
    novos.push({ lancamento_id:lanc.id, nome:f.name, caminho:caminho,
                 tipo:f.type||null, tamanho:f.size, exemplo:!!lanc.exemplo });
  }
  if(novos.length){
    var ins = await API.inserir("fin_anexos", novos);
    D.anexos = D.anexos.concat(ins);
  }
  return novos.length;
}
async function apagarAnexo(a){
  try{ await API.apagarArquivo(a.caminho); }catch(e){}
  await API.apagar("fin_anexos", a.id);
  D.anexos = D.anexos.filter(function(x){ return x.id!==a.id; });
}

function nomeCat(l){
  var c = categoria(l.categoria_id), s = subcategoria(l.subcategoria_id);
  if(!c) return "—";
  return c.nome + (s ? " · " + s.nome : "");
}

/* Lançamento informativo: fica registrado mas não mexe em dinheiro nenhum
   (saldo, limite, fatura, painel e relatórios ignoram). */
function ehInfo(l){ return !!l.informativo; }
function valem(lista){ return lista.filter(function(l){ return !ehInfo(l); }); }

/* Saldo de uma conta: inicial + receitas pagas − despesas pagas (inclui pagamento de fatura) */
function saldoConta(id){
  var c = conta(id); if(!c) return 0;
  var s = Number(c.saldo_inicial)||0;
  D.lancamentos.forEach(function(l){
    if(ehInfo(l) || l.forma!=="conta" || l.conta_id!==id || l.status!=="pago") return;
    s += (l.tipo==="receita" ? 1 : -1) * (Number(l.valor)||0);
  });
  return s;
}
function saldoTotal(){ return D.contas.filter(a=>a.ativo!==false).reduce(function(a,c){ return a + saldoConta(c.id); },0); }

/* Limite: compromete tudo que está em fatura não paga (ou ainda sem fatura fechada) */
function usoCartao(id){
  var usado = 0;
  D.lancamentos.forEach(function(l){
    if(ehInfo(l) || l.forma!=="cartao" || l.cartao_id!==id) return;
    var f = l.fatura_id ? fatura(l.fatura_id) : null;
    if(f && f.status==="paga") return;
    usado += Number(l.valor)||0;
  });
  return usado;
}
function limiteDisponivel(id){
  var c = cartao(id); if(!c) return 0;
  return (Number(c.limite_total)||0) - usoCartao(id);
}

function statusLanc(l){
  if(ehInfo(l)) return "informativo";
  if(l.status==="pago") return "pago";
  // compra no cartão não vence sozinha: quem vence é a fatura
  if(l.forma==="cartao"){
    var f = l.fatura_id ? fatura(l.fatura_id) : null;
    if(f && f.status==="paga") return "pago";
    if(f && f.vencimento < hoje()) return "vencido";
    return "fatura";
  }
  if(l.data && String(l.data).slice(0,10) < hoje()) return "vencido";
  return "pendente";
}
function selo(st){
  var m = { pago:["s-pago","Pago"], pendente:["s-pend","Pendente"], vencido:["s-venc","Vencido"],
            fatura:["s-fat","Na fatura"], informativo:["s-info","Informativo"],
            aberta:["s-pend","Aberta"], paga:["s-pago","Paga"] }[st] || ["s-pend",st];
  return '<span class="selo '+m[0]+'">'+m[1]+'</span>';
}

/* Garante a fatura (cria se não existir) e devolve o id */
async function garantirFatura(cartaoObj, ciclo){
  var achou = D.faturas.filter(function(f){
    return f.cartao_id===cartaoObj.id && f.competencia===ciclo.competencia; })[0];
  if(achou) return achou.id;
  var nova = (await API.inserir("fin_faturas", {
    cartao_id: cartaoObj.id, competencia: ciclo.competencia,
    fechamento: ciclo.fechamento, vencimento: ciclo.vencimento, status: "aberta",
    exemplo: !!cartaoObj.exemplo
  }))[0];
  D.faturas.push(nova);
  return nova.id;
}

function totalFatura(f){
  return D.lancamentos.filter(function(l){ return l.fatura_id===f.id && !ehInfo(l); })
    .reduce(function(a,l){ return a + (Number(l.valor)||0); },0);
}

/* ===================================================================
   Recorrências: materializa as ocorrências que faltam
=================================================================== */
async function gerarRecorrencias(){
  var limite = addMeses(hoje(), 12);
  var novos = [];
  for(var i=0;i<D.recorrencias.length;i++){
    var r = D.recorrencias[i];
    if(r.ativo===false) continue;
    var fim = r.fim && r.fim < limite ? r.fim : limite;
    var data = diaNoMes(+r.inicio.slice(0,4), +r.inicio.slice(5,7), r.dia);
    if(data < r.inicio) data = addMeses(data, 1);
    var guarda = 0;
    while(data <= fim && guarda++ < 400){
      var existe = D.lancamentos.some(function(l){
        return l.recorrencia_id===r.id && ym(l.data)===ym(data); });
      if(!existe){
        var base = {
          tipo:r.tipo, forma:r.forma, descricao:r.descricao, valor:r.valor, data:data,
          categoria_id:r.categoria_id, subcategoria_id:r.subcategoria_id,
          conta_id:r.forma==="conta"?r.conta_id:null, cartao_id:r.forma==="cartao"?r.cartao_id:null,
          status:"pendente", recorrencia_id:r.id, exemplo:!!r.exemplo,
          informativo: !!r.informativo
        };
        if(r.forma==="cartao"){
          var c = cartao(r.cartao_id);
          if(c){
            var ciclo = faturaDaCompra(c, data);
            base.fatura_id = await garantirFatura(c, ciclo);
          }
        }
        novos.push(base);
      }
      data = addMeses(data, 1);
      // respeita o dia configurado mesmo depois de meses curtos
      data = diaNoMes(+data.slice(0,4), +data.slice(5,7), r.dia);
    }
  }
  if(novos.length){
    var inseridos = await API.inserir("fin_lancamentos", novos);
    D.lancamentos = D.lancamentos.concat(inseridos);
  }
  return novos.length;
}

/* ===================================================================
   Carga
=================================================================== */
async function carregar(){
  var nomes = ["fin_contas","fin_cartoes","fin_categorias","fin_subcategorias",
               "fin_recorrencias","fin_faturas","fin_lancamentos","fin_anexos"];
  var res = await Promise.all(nomes.map(function(t){ return API.listar(t); }));
  D.contas=res[0]; D.cartoes=res[1]; D.categorias=res[2]; D.subcategorias=res[3];
  D.recorrencias=res[4]; D.faturas=res[5]; D.lancamentos=res[6]; D.anexos=res[7]||[];
  await gerarRecorrencias();
}

   Navegação e casca
=================================================================== */
var VIEWS = [
  ["painel","Painel"], ["lancamentos","Lançamentos"], ["contas","Contas"],
  ["cartoes","Cartões"], ["faturas","Faturas"], ["categorias","Categorias"], ["relatorios","Relatórios"]
];

/* Tema: mesma chave que o RLhub usa, para as páginas ficarem iguais. */
function temaAtual(){
  var t = document.documentElement.getAttribute("data-theme");
  return t==="dark" ? "dark" : "light";
}
function aplicarTema(t){
  document.documentElement.setAttribute("data-theme", t==="dark" ? "dark" : "light");
  try{ localStorage.setItem("pt_tema", t); }catch(e){}
  var b = document.getElementById("tema");
  if(b) b.textContent = t==="dark" ? "Tema claro" : "Tema escuro";
}
function temaInicial(){
  var t = null;
  try{ t = localStorage.getItem("pt_tema"); }catch(e){}
  if(!t) t = (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", t==="dark" ? "dark" : "light");
}
temaInicial();
// o hub troca o tema direto no <html> do iframe; acompanhamos o rótulo do botão
new MutationObserver(function(){
  var b = document.getElementById("tema");
  if(b) b.textContent = temaAtual()==="dark" ? "Tema claro" : "Tema escuro";
}).observe(document.documentElement, { attributes:true, attributeFilter:["data-theme"] });

function casca(){
  return '<div class="app">'+
    '<nav class="nav">'+
      '<div class="marca"><span class="mk">R$</span><span><b>Receitas e Despesas</b>'+
        '<span class="legenda">Finanças pessoais</span></span></div>'+
      VIEWS.map(function(v){
        return '<button type="button" data-view="'+v[0]+'" aria-current="'+(estado.view===v[0])+'">'+v[1]+'</button>';
      }).join("")+
      '<button type="button" id="ocultar" class="tema" data-act="ocultarValores">'+
        (OCULTO ? "Mostrar valores" : "Ocultar valores")+'</button>'+
      '<button type="button" id="tema" class="tema" data-act="trocarTema">'+
        (temaAtual()==="dark" ? "Tema claro" : "Tema escuro")+'</button>'+
    '</nav>'+
    '<main class="conteudo" id="conteudo"></main>'+
  '</div>';
}

function render(){
  var raiz = $("#raiz");
  if(!raiz.querySelector(".app")) raiz.innerHTML = casca();
  $$(".nav button").forEach(function(b){ b.setAttribute("aria-current", String(estado.view===b.dataset.view)); });
  var alvo = $("#conteudo");
  var f = { painel:vPainel, lancamentos:vLancamentos, contas:vContas, cartoes:vCartoes,
            faturas:vFaturas, categorias:vCategorias, relatorios:vRelatorios }[estado.view];
  alvo.innerHTML = f();
  alvo.scrollTop = 0;
  barraExemplo();
}

/* Barra flutuante: carregar / apagar dados de exemplo.
   Refeita a cada render para refletir o estado atual. */
function barraExemplo(){
  var tem = ["contas","cartoes","categorias","lancamentos"].some(function(k){
    return D[k].some(function(r){ return r.exemplo; }); });
  var bar = document.getElementById("barraExemplo");
  if(!bar){
    bar = document.createElement("div");
    bar.id = "barraExemplo";
    bar.style.cssText = "position:fixed;right:16px;bottom:16px;z-index:50;display:flex;gap:8px";
    document.body.appendChild(bar);
  }
  var html = tem
    ? '<button class="btn perigo" data-act="limparExemplo">Apagar dados de exemplo</button>'
    : '<button class="btn" data-act="carregarExemplo">Carregar dados de exemplo</button>';
  if(bar.innerHTML !== html) bar.innerHTML = html;
}

document.addEventListener("click", function(ev){
  var nav = ev.target.closest(".nav button[data-view]");
  if(nav){ estado.view = nav.dataset.view; render(); return; }
  var b = ev.target.closest("[data-act]");
  if(!b) return;
  var act = b.dataset.act;
  if(ACOES[act]) ACOES[act](b);
});

/* ===================================================================
   Painel
=================================================================== */
function mesAtualLanc(){
  return D.lancamentos.filter(function(l){ return ym(l.data)===estado.mes; });
}

function vPainel(){
  var mTodos = mesAtualLanc();
  var m = valem(mTodos);                       // informativos ficam de fora das contas
  var info = mTodos.filter(ehInfo);
  var receitas = m.filter(l=>l.tipo==="receita").reduce((a,l)=>a+Number(l.valor),0);
  var despesas = m.filter(l=>l.tipo==="despesa").reduce((a,l)=>a+Number(l.valor),0);

  // gastos por categoria no mês
  var porCat = {};
  m.filter(l=>l.tipo==="despesa").forEach(function(l){
    var c = categoria(l.categoria_id); var nome = c?c.nome:"Sem categoria";
    porCat[nome] = (porCat[nome]||0) + Number(l.valor);
  });
  var cats = Object.keys(porCat).map(k=>({nome:k,valor:porCat[k]})).sort((a,b)=>b.valor-a.valor).slice(0,8);
  var maxCat = cats.length ? cats[0].valor : 1;

  // próximas contas a vencer: o que está vencido + o que vence nos próximos 2 meses
  var limiteProx = addMeses(hoje(), 2);
  var proxTodas = D.lancamentos.filter(function(l){
    return !ehInfo(l) && l.forma==="conta" && l.status!=="pago" && l.tipo==="despesa"
           && String(l.data).slice(0,10) <= limiteProx;
  }).sort((a,b)=> a.data < b.data ? -1 : 1);
  var prox = proxTodas.slice(0,6);

  // faturas
  var fats = D.faturas.filter(f=>f.status!=="paga").map(function(f){
    return { f:f, c:cartao(f.cartao_id), total: totalFatura(f) };
  }).filter(x=>x.c && x.total>0).sort((a,b)=> a.f.vencimento < b.f.vencimento ? -1 : 1).slice(0,6);

  var saldo = saldoTotal();

  return topoMes("Painel", "Resumo de "+mesBR(estado.mes)) +
  '<div class="kpis">'+
    kpi("Saldo total em contas", BRL(saldo), D.contas.length+" conta(s) cadastrada(s)", saldo<0?"neg":"") +
    kpi("Receitas do mês", BRL(receitas), m.filter(l=>l.tipo==="receita").length+" lançamento(s)", "pos") +
    kpi("Despesas do mês", BRL(despesas), m.filter(l=>l.tipo==="despesa").length+" lançamento(s)", "neg") +
    kpi("Resultado do mês", BRL(receitas-despesas), receitas-despesas>=0?"Sobrou":"Faltou", receitas-despesas>=0?"pos":"neg") +
  '</div>'+
  (info.length ? '<p class="legenda" style="margin:-8px 0 16px">'+info.length+
    ' lançamento(s) informativo(s) no mês, somando '+BRL(info.reduce((a,l)=>a+Number(l.valor),0))+
    ' — não entram em nenhum total.</p>' : "")+

  '<div class="grid2">'+
    '<div class="card"><div class="card-h"><h3>Gastos por categoria</h3>'+
      '<span class="legenda">'+mesBR(estado.mes)+'</span></div>'+
      '<div class="card-b">'+ (cats.length ?
        '<div class="barras">'+cats.map(function(c){
          return '<div><div class="barra-l"><span>'+esc(c.nome)+'</span>'+
            '<span class="num forte">'+BRL(c.valor)+'</span></div>'+
            '<div class="barra"><i style="width:'+(c.valor/maxCat*100)+'%"></i></div></div>';
        }).join("")+'</div>'
        : '<div class="vazio">Nenhuma despesa neste mês.</div>') +
      '</div></div>'+

    '<div>'+
      '<div class="card"><div class="card-h"><h3>Próximas contas a vencer</h3>'+
        '<span class="legenda">'+(proxTodas.length>prox.length
          ? "as 6 primeiras de "+proxTodas.length : "até "+dBR(limiteProx))+'</span></div>'+
        (prox.length ? '<div class="tabela-rolagem"><table><tbody>'+prox.map(function(l){
          var st = statusLanc(l);
          return '<tr><td><span class="forte">'+esc(l.descricao)+'</span>'+
            '<div class="legenda">'+dBR(l.data)+' · '+esc(nomeCat(l))+'</div></td>'+
            '<td class="r num">'+BRL(l.valor)+'<div>'+selo(st)+'</div></td></tr>';
        }).join("")+'</tbody></table></div>' : '<div class="vazio">Nada em aberto.</div>')+
      '</div>'+
      '<div class="card"><div class="card-h"><h3>Faturas de cartão</h3></div>'+
        (fats.length ? '<div class="tabela-rolagem"><table><tbody>'+fats.map(function(x){
          return '<tr><td><span class="forte">'+esc(x.c.nome)+'</span>'+
            '<div class="legenda">vence '+dBR(x.f.vencimento)+'</div></td>'+
            '<td class="r num">'+BRL(x.total)+'<div>'+selo(x.f.status)+'</div></td></tr>';
        }).join("")+'</tbody></table></div>' : '<div class="vazio">Nenhuma fatura aberta.</div>')+
      '</div>'+
    '</div>'+
  '</div>';
}

function kpi(rot, val, det, cls){
  return '<div class="kpi"><div class="rotulo">'+esc(rot)+'</div>'+
    '<div class="v '+(cls||"")+'">'+val+'</div><div class="d">'+esc(det)+'</div></div>';
}
function topoMes(titulo, sub){
  return '<div class="topo"><div><h1>'+esc(titulo)+'</h1><p class="legenda">'+esc(sub)+'</p></div>'+
    '<div class="acoes">'+
      '<input type="month" value="'+estado.mes+'" data-act="mudarMes" style="height:34px;border:1px solid var(--border-strong);border-radius:var(--radius-md);padding:0 10px;background:var(--surface-000)">'+
      '<button class="btn primary" data-act="novoLanc">+ Lançamento</button>'+
    '</div></div>';
}

/* ===================================================================
   Lançamentos
=================================================================== */
function filtrar(lista){
  var f = estado.filtros;
  return lista.filter(function(l){
    if(f.de && l.data < f.de) return false;
    if(f.ate && l.data > f.ate) return false;
    if(f.tipo && l.tipo !== f.tipo) return false;
    if(f.forma && l.forma !== f.forma) return false;
    if(f.categoria && l.categoria_id !== f.categoria) return false;
    if(f.status && statusLanc(l) !== f.status) return false;
    return true;
  }).sort(function(a,b){ return a.data < b.data ? 1 : a.data > b.data ? -1 : 0; });
}

function vLancamentos(){
  var f = estado.filtros;
  var lista = filtrar(D.lancamentos);
  var contam = valem(lista);
  var rec = contam.filter(l=>l.tipo==="receita").reduce((a,l)=>a+Number(l.valor),0);
  var des = contam.filter(l=>l.tipo==="despesa").reduce((a,l)=>a+Number(l.valor),0);
  var nInfo = lista.length - contam.length;

  return '<div class="topo"><div><h1>Lançamentos</h1>'+
    '<p class="legenda">'+lista.length+' lançamento(s) · receitas '+BRL(rec)+' · despesas '+BRL(des)+
      (nInfo ? ' · '+nInfo+' informativo(s) fora da conta' : "")+'</p></div>'+
    '<div class="acoes"><button class="btn" data-act="novaRecorrencia">+ Recorrente</button>'+
    '<button class="btn primary" data-act="novoLanc">+ Lançamento</button></div></div>'+

    '<div class="card"><div class="card-b"><div class="filtros">'+
      campoFiltro("de","De","date",f.de)+
      campoFiltro("ate","Até","date",f.ate)+
      selFiltro("tipo","Tipo",[["","Todos"],["receita","Receitas"],["despesa","Despesas"]],f.tipo)+
      selFiltro("forma","Forma",[["","Todas"],["conta","Conta"],["cartao","Cartão"]],f.forma)+
      selFiltro("status","Situação",[["","Todas"],["pago","Pago"],["pendente","Pendente"],
        ["vencido","Vencido"],["fatura","Na fatura"],["informativo","Informativo"]],f.status)+
      selFiltro("categoria","Categoria",[["","Todas"]].concat(D.categorias.map(c=>[c.id,c.nome])),f.categoria)+
      '<div><button class="btn" data-act="limparFiltros" style="width:100%">Limpar filtros</button></div>'+
    '</div></div></div>'+

    '<div class="card">'+ (lista.length ?
      '<div class="tabela-rolagem"><table><thead><tr>'+
        '<th>Data</th><th>Descrição</th><th>Categoria</th><th>Origem</th>'+
        '<th class="r">Valor</th><th>Situação</th><th></th></tr></thead><tbody>'+
        lista.map(linhaLanc).join("")+
      '</tbody></table></div>'
      : '<div class="vazio"><h4>Nenhum lançamento</h4><p>Ajuste os filtros ou registre o primeiro.</p></div>')+
    '</div>';
}

function linhaLanc(l){
  var st = statusLanc(l);
  var origem = l.forma==="cartao"
    ? ((cartao(l.cartao_id)||{}).nome||"cartão") + (l.parcela_total>1 ? " · "+l.parcela_num+"/"+l.parcela_total : "")
    : ((conta(l.conta_id)||{}).nome||"conta");
  var nAnexos = anexosDe(l).length;
  return '<tr><td class="num">'+dBR(l.data)+'</td>'+
    '<td><span class="forte">'+esc(l.descricao)+'</span>'+
      (nAnexos ? '<button type="button" class="clipe-lista" data-act="verAnexos" data-id="'+l.id+
        '" title="Ver anexos">📎 '+nAnexos+'</button>' : "")+
      (l.recorrencia_id?'<div class="legenda">recorrente</div>':"")+'</td>'+
    '<td>'+esc(nomeCat(l))+'</td>'+
    '<td>'+esc(origem)+'</td>'+
    '<td class="r num '+(ehInfo(l) ? "valor-info" : (l.tipo==="receita"?"pos":""))+'">'+
      (l.tipo==="receita"?"+":"−")+BRL(l.valor)+'</td>'+
    '<td>'+selo(st)+'</td>'+
    '<td class="r"><div class="acoes" style="justify-content:flex-end">'+
      (!ehInfo(l) && l.forma==="conta" && l.status!=="pago" ? '<button class="btn sm" data-act="pagarLanc" data-id="'+l.id+'">Pagar</button>' : "")+
      '<button class="btn sm" data-act="editarLanc" data-id="'+l.id+'">Editar</button>'+

function vExtrato(){
  var c = conta(estado.contaExtrato);
  if(!c){ estado.contaExtrato=null; return vContas(); }
  var f = estado.filtros;
  var lista = filtrar(D.lancamentos.filter(l=>l.forma==="conta" && l.conta_id===c.id))
              .slice().sort(function(a,b){ return a.data < b.data ? -1 : 1; });
  var acum = Number(c.saldo_inicial)||0;
  var linhas = lista.map(function(l){
    var info = ehInfo(l);
    var val = (l.tipo==="receita"?1:-1)*Number(l.valor);
    if(!info && l.status==="pago") acum += val;
    return '<tr><td class="num">'+dBR(l.data)+'</td>'+
      '<td><span class="forte">'+esc(l.descricao)+'</span><div class="legenda">'+esc(nomeCat(l))+'</div></td>'+
      '<td class="r num '+(info ? "valor-info" : (l.tipo==="receita"?"pos":"neg"))+'">'+
        (l.tipo==="receita"?"+":"−")+BRL(l.valor)+'</td>'+
      '<td>'+selo(statusLanc(l))+'</td>'+
      '<td class="r num forte">'+((!info && l.status==="pago")?BRL(acum):"—")+'</td></tr>';
  }).join("");

  return '<div class="topo"><div><h1>Extrato · '+esc(c.nome)+'</h1>'+
    '<p class="legenda">Saldo inicial '+BRL(c.saldo_inicial)+' · saldo atual '+BRL(saldoConta(c.id))+'</p></div>'+
    '<div class="acoes"><button class="btn" data-act="voltarContas">Voltar</button></div></div>'+
    '<div class="card"><div class="card-b"><div class="filtros">'+
      campoFiltro("de","De","date",f.de)+ campoFiltro("ate","Até","date",f.ate)+
      selFiltro("tipo","Tipo",[["","Todos"],["receita","Receitas"],["despesa","Despesas"]],f.tipo)+
      selFiltro("categoria","Categoria",[["","Todas"]].concat(D.categorias.map(c2=>[c2.id,c2.nome])),f.categoria)+
      '<div><button class="btn" data-act="limparFiltros" style="width:100%">Limpar</button></div>'+
    '</div></div></div>'+
    '<div class="card">'+(lista.length ?
      '<div class="tabela-rolagem"><table><thead><tr><th>Data</th><th>Descrição</th>'+
      '<th class="r">Valor</th><th>Situação</th><th class="r">Saldo acumulado</th></tr></thead>'+
      '<tbody>'+linhas+'</tbody></table></div>'
      : '<div class="vazio">Sem lançamentos nesta conta com os filtros atuais.</div>')+'</div>';
}

function vFaturas(){

    .map(f=>({f:f,total:totalFatura(f)}))
    .sort((a,b)=> a.f.competencia < b.f.competencia ? 1 : -1);

  var sel = estado.competenciaFatura ||
    (fats.filter(x=>x.f.status!=="paga")[0]||fats[0]||{f:{}}).f.competencia;

      '</select>'+
      (fats.length ? '<select data-act="trocarCompetencia" style="height:34px;border:1px solid var(--border-strong);border-radius:var(--radius-md);padding:0 10px;background:var(--surface-000)">'+

/* ===================================================================
   Relatórios
=================================================================== */
function vRelatorios(){
  var m = valem(D.lancamentos.filter(l=>ym(l.data)===estado.mes));
  var infoMes = D.lancamentos.filter(l=>ym(l.data)===estado.mes && ehInfo(l));
  function agrupar(chave, rotulo){
    var mapa = {};
    m.forEach(function(l){
      var k = chave(l); if(k===null) return;
      if(!mapa[k]) mapa[k] = {receita:0,despesa:0};
      mapa[k][l.tipo] += Number(l.valor);
    });
    var linhas = Object.keys(mapa).map(k=>({k:k,r:mapa[k].receita,d:mapa[k].despesa}))
      .sort((a,b)=>(b.r+b.d)-(a.r+a.d));
    if(!linhas.length) return '<div class="vazio">Sem dados em '+mesBR(estado.mes)+'.</div>';
    return '<div class="tabela-rolagem"><table><thead><tr><th>'+rotulo+'</th>'+
      '<th class="r">Receitas</th><th class="r">Despesas</th><th class="r">Saldo</th></tr></thead><tbody>'+
      linhas.map(function(x){
        return '<tr><td class="forte">'+esc(x.k)+'</td>'+
          '<td class="r num pos">'+(x.r?BRL(x.r):"—")+'</td>'+
          '<td class="r num neg">'+(x.d?BRL(x.d):"—")+'</td>'+
          '<td class="r num '+((x.r-x.d)>=0?"pos":"neg")+'">'+BRL(x.r-x.d)+'</td></tr>';
      }).join("")+'</tbody><tfoot><tr><td>Total</td>'+
      '<td class="r num">'+BRL(linhas.reduce((a,x)=>a+x.r,0))+'</td>'+
      '<td class="r num">'+BRL(linhas.reduce((a,x)=>a+x.d,0))+'</td>'+
      '<td class="r num">'+BRL(linhas.reduce((a,x)=>a+x.r-x.d,0))+'</td></tr></tfoot></table></div>';
  }

  return topoMes("Relatórios","Consolidado de "+mesBR(estado.mes))+
    (infoMes.length ? '<p class="legenda" style="margin:-8px 0 16px">Fora destes números: '+
      infoMes.length+' lançamento(s) informativo(s), '+
      BRL(infoMes.reduce((a,l)=>a+Number(l.valor),0))+'.</p>' : "")+
    '<div class="card"><div class="card-h"><h3>Por categoria</h3></div>'+
      agrupar(function(l){ var c=categoria(l.categoria_id); return c?c.nome:"Sem categoria"; },"Categoria")+'</div>'+
    '<div class="card"><div class="card-h"><h3>Por subcategoria</h3></div>'+
      agrupar(function(l){ var s=subcategoria(l.subcategoria_id); if(!s) return null;
        var c=categoria(l.categoria_id); return (c?c.nome+" · ":"")+s.nome; },"Subcategoria")+'</div>'+
    '<div class="card"><div class="card-h"><h3>Por conta bancária</h3></div>'+
      agrupar(function(l){ if(l.forma!=="conta") return null; var c=conta(l.conta_id); return c?c.nome:null; },"Conta")+'</div>'+
    '<div class="card"><div class="card-h"><h3>Por cartão de crédito</h3></div>'+
      agrupar(function(l){ if(l.forma!=="cartao") return null; var c=cartao(l.cartao_id); return c?c.nome:null; },"Cartão")+'</div>';
}

=================================================================== */
function abrirDialogo(titulo, corpoHtml, aoConfirmar, rotuloConfirmar){
  var d = document.createElement("dialog");
  d.innerHTML = '<form method="dialog"><div class="dlg-h"><h3>'+esc(titulo)+'</h3></div>'+
    '<div class="dlg-b">'+corpoHtml+'<p class="erro" id="dlgErro" style="display:none"></p></div>'+
    '<div class="dlg-f"><button class="btn" value="cancelar" type="submit">Cancelar</button>'+
    '<button class="btn primary" id="dlgOk" type="button">'+esc(rotuloConfirmar||"Salvar")+'</button></div></form>';
  document.body.appendChild(d);
  d.addEventListener("close", function(){ d.remove(); });
  $("#dlgOk", d).addEventListener("click", async function(){
    var erro = $("#dlgErro", d);
    erro.style.display = "none";
    try{
      var r = await aoConfirmar(d);
      if(r === false) return;
      d.close();
      render();
    }catch(e){
      erro.textContent = (e && e.message) ? e.message : String(e);
      erro.style.display = "block";
    }
  });
  d.showModal();
  var p = d.querySelector("input,select,textarea"); if(p) p.focus();
  return d;
}

  if(!nome) falha("Informe o nome do cartão.");
  if(!(fech>=1&&fech<=31)) falha("Dia de fechamento inválido.");
  if(!(venc>=1&&venc<=31)) falha("Dia de vencimento inválido.");
  return { nome:nome, emissor:$("#kEmissor",d).value.trim()||null,
           limite_total:Number($("#kLimite",d).value)||0,
           dia_fechamento:fech, dia_vencimento:venc,
           ativo: $("#kAtivo",d) ? $("#kAtivo",d).checked : true };
}

        '<option value="conta"'+sel(forma,"conta")+'>Conta bancária</option>'+

    '</div>'+
    '<div class="campo"><label class="rotulo">Descrição</label><input id="fDesc" placeholder="ex.: Supermercado" value="'+esc(l.descricao||"")+'"></div>'+

      '<div class="campo"><label class="rotulo">Valor (R$)</label><input id="fValor" type="number" step="0.01" min="0.01" placeholder="0,00" value="'+(l.valor!=null?Number(l.valor):"")+'"></div>'+

      '<div class="campo"><label class="rotulo">Subcategoria</label><select id="fSub">'+opcoesSub(l.categoria_id, l.subcategoria_id)+'</select></div>'+
    '</div>'+
    '<div class="campo" id="blocoConta"><label class="rotulo">Conta bancária</label><select id="fConta">'+opcoesConta(l.conta_id)+'</select></div>'+

      'nem entra no limite, na fatura, no painel ou nos relatórios.</span></span></label>'+

function listaAnexosHtml(l){
  var as = anexosDe(l);
  if(!as.length) return "";
  return '<ul class="anexos">'+as.map(function(a){
    return '<li><span class="clipe" aria-hidden="true">📎</span>'+
      '<span class="nome">'+esc(a.nome)+'</span>'+
      '<span class="legenda">'+tamanhoArquivo(a.tamanho)+'</span>'+
      '<span class="acoes">'+
        '<button type="button" class="btn sm" data-act="baixarAnexo" data-id="'+a.id+'">Abrir</button>'+
        '<button type="button" class="btn sm" data-act="removerAnexo" data-id="'+a.id+'">Excluir</button>'+
      '</span></li>';
  }).join("")+'</ul>';
}

function ligarFormLanc(d, l){
  var subInicial = l && l.subcategoria_id ? l.subcategoria_id : "";
  function sync(){
    var forma = $("#fForma",d).value, tipo = $("#fTipo",d).value;
    // receita só entra em conta
    if(tipo==="receita"){ $("#fForma",d).value="conta"; forma="conta"; $("#fForma",d).disabled=true; }
    else $("#fForma",d).disabled=false;
    $("#blocoConta",d).style.display = forma==="conta" ? "" : "none";
    $("#blocoCartao",d).style.display = forma==="cartao" ? "" : "none";
    $("#fStatus",d).parentNode.style.display = forma==="cartao" ? "none" : "";
    var cat = $("#fCat",d);
    var atual = cat.value;
    cat.innerHTML = opcoesCategoria(tipo, atual);
    $("#fSub",d).innerHTML = opcoesSub(cat.value, subInicial);
    subInicial = "";   // só na primeira montagem
    var c = cartao($("#fCartao",d).value);
    $("#infoCartao",d).textContent = c
      ? "Disponível "+BRL(limiteDisponivel(c.id))+" · fecha dia "+c.dia_fechamento
      : "—";
  }
  ["#fTipo","#fForma","#fCartao"].forEach(function(s){ $(s,d).addEventListener("change", sync); });
  $("#fCat",d).addEventListener("change", function(){ $("#fSub",d).innerHTML = opcoesSub($("#fCat",d).value); });
  sync();
}

  novoLanc: function(){
    if(!D.categorias.length) return alert("Cadastre ao menos uma categoria antes de lançar.");
    var d = abrirDialogo("Novo lançamento", corpoLancamento(), async function(d){
      var tipo=$("#fTipo",d).value, forma=$("#fForma",d).value;
      var desc=$("#fDesc",d).value.trim(), valor=Number($("#fValor",d).value);
      var data=$("#fData",d).value, cat=$("#fCat",d).value, sub=$("#fSub",d).value;
      var obs=$("#fObs",d).value.trim(), info=$("#fInfo",d).checked;

      if(!desc) falha("Informe a descrição.");
      if(!(valor>0)) falha("Informe um valor maior que zero.");
      if(!data) falha("Informe a data.");
      if(!cat) falha("Escolha uma categoria — lançamento sem categoria não é aceito.");

      if(forma==="conta"){
        var contaId=$("#fConta",d).value;
        if(!contaId) falha("Escolha a conta bancária.");
        var novo = (await API.inserir("fin_lancamentos", {
          tipo:tipo, forma:"conta", descricao:desc, valor:valor, data:data,
          categoria_id:cat, subcategoria_id:sub||null, conta_id:contaId,
          status:$("#fStatus",d).value, pago_em: $("#fStatus",d).value==="pago"?data:null,
          observacao:obs||null, informativo:info
        }))[0];
        D.lancamentos.push(novo);
        await enviarAnexos(novo, $("#fArq",d).files);
        return;
      }

      // cartão
      var cartaoId=$("#fCartao",d).value;
      if(!cartaoId) falha("Escolha o cartão de crédito.");
      var c = cartao(cartaoId);
      var n = Math.max(1, Math.min(60, parseInt($("#fParcelas",d).value,10)||1));
      var disp = limiteDisponivel(c.id);
      if(!info && valor > disp){
        if(!confirm("Esta compra de "+BRL(valor)+" ultrapassa o limite disponível de "+BRL(disp)+
                    " neste cartão.\n\nLançar mesmo assim?")) return false;
      }
      var valores = dividirParcelas(valor, n);
      var compraId = uid();
      var ciclo = faturaDaCompra(c, data);
      var linhas = [];
      for(var i=0;i<n;i++){
        var cic = i===0 ? ciclo : faturaSeguinte(c, ciclo.competencia, i);
        var fid = await garantirFatura(c, cic);
        linhas.push({
          tipo:"despesa", forma:"cartao", descricao:desc, valor:valores[i],
          data: i===0 ? data : cic.fechamento,
          categoria_id:cat, subcategoria_id:sub||null, cartao_id:c.id, fatura_id:fid,
          status:"pendente", compra_id:compraId, parcela_num:i+1, parcela_total:n,
          observacao:obs||null, informativo:info
        });
      }
      var ins = await API.inserir("fin_lancamentos", linhas);
      D.lancamentos = D.lancamentos.concat(ins);
      // o anexo fica na primeira parcela e vale para a compra inteira
      await enviarAnexos(ins[0], $("#fArq",d).files);
    });
    ligarFormLanc(d);
  },

  editarLanc: function(b){
    var l = D.lancamentos.filter(x=>x.id===b.dataset.id)[0];
    if(!l) return;
    if(l.pagamento_fatura_id)
      return alert("Este lançamento é o pagamento de uma fatura. Para mudá-lo, "+
                   "desfaça o pagamento na tela de Faturas.");

    var parcelada = l.forma==="cartao" && l.parcela_total > 1;
    var d = abrirDialogo("Editar lançamento", corpoLancamento(l), async function(d){
      var desc=$("#fDesc",d).value.trim(), valor=Number($("#fValor",d).value);
      var cat=$("#fCat",d).value, sub=$("#fSub",d).value;
      var obs=$("#fObs",d).value.trim(), info=$("#fInfo",d).checked;
      var data=$("#fData",d).value;

      if(!desc) falha("Informe a descrição.");
      if(!(valor>0)) falha("Informe um valor maior que zero.");
      if(!cat) falha("Escolha uma categoria — lançamento sem categoria não é aceito.");
      if(!parcelada && !data) falha("Informe a data.");

      var campos = { descricao:desc, valor:valor, categoria_id:cat,
                     subcategoria_id:sub||null, observacao:obs||null, informativo:info };

      if(parcelada){
        // só a parcela escolhida muda; data e fatura seguem o ciclo original
      } else if(l.forma==="conta"){
        var contaId=$("#fConta",d).value;
        if(!contaId) falha("Escolha a conta bancária.");
        var st = $("#fStatus",d).value;
        campos.tipo = $("#fTipo",d).value;
        campos.data = data;
        campos.conta_id = contaId;
        campos.status = st;
        campos.pago_em = st==="pago" ? (l.pago_em || data) : null;
      } else {
        var cartaoId=$("#fCartao",d).value;
        if(!cartaoId) falha("Escolha o cartão de crédito.");
        var c = cartao(cartaoId);
        campos.data = data;
        campos.cartao_id = cartaoId;
        if(cartaoId !== l.cartao_id || data !== String(l.data).slice(0,10)){
          campos.fatura_id = await garantirFatura(c, faturaDaCompra(c, data));
        }
        var fAtual = campos.fatura_id ? fatura(campos.fatura_id) : fatura(l.fatura_id);
        if(fAtual && fAtual.status==="paga")
          falha("Esta compra cairia numa fatura já paga. Escolha outra data.");
      }

      await API.atualizar("fin_lancamentos", l.id, campos);
      Object.assign(l, campos);
      await enviarAnexos(l, $("#fArq",d).files);
    }, "Salvar alterações");

    ligarFormLanc(d, l);
    // a forma não muda numa edição: trocar conta↔cartão é excluir e lançar de novo
    $("#fForma",d).disabled = true;
    $("#blocoParcelas",d).style.display = "none";
    if(parcelada){
      $("#fData",d).parentNode.style.display = "none";
      $("#fCartao",d).parentNode.style.display = "none";
      $("#infoCartao",d).textContent = "Parcela "+l.parcela_num+"/"+l.parcela_total+
        " — data e fatura seguem o ciclo da compra";

        var lanc = (await API.inserir("fin_lancamentos", {
          tipo:"despesa", forma:"conta", descricao:"Pagamento de fatura · "+((cartao(f.cartao_id)||{}).nome||""),
          valor:valor, data:data, categoria_id: cat?cat.id:null, conta_id:contaId,
          status:"pago", pago_em:data, pagamento_fatura_id:f.id, exemplo: !!f.exemplo
        }))[0];
        D.lancamentos.push(lanc);
        await API.atualizar("fin_faturas", f.id, {
          status:"paga", pago_em:data, conta_pagamento_id:contaId, valor_pago:valor });
        Object.assign(f, { status:"paga", pago_em:data, conta_pagamento_id:contaId, valor_pago:valor });
      }, "Registrar pagamento");
  },

  trocarCartaoFatura: function(){},
  trocarCompetencia: function(){},

  novaCategoria: function(b){
    var tipo=b.dataset.tipo;
    abrirDialogo("Nova categoria de "+tipo,
      '<div class="campo"><label class="rotulo">Nome</label><input id="gNome" placeholder="ex.: Moradia"></div>',
      async function(d){
        var nome=$("#gNome",d).value.trim();
        if(!nome) falha("Informe o nome da categoria.");
        var nova = (await API.inserir("fin_categorias", { nome:nome, tipo:tipo }))[0];
        D.categorias.push(nova);
      });
  },

  novaSub: function(b){
    var catId=b.dataset.id;
    abrirDialogo("Nova subcategoria de "+esc((categoria(catId)||{}).nome||""),
      '<div class="campo"><label class="rotulo">Nome</label><input id="sNome" placeholder="ex.: Aluguel"></div>',
      async function(d){
        var nome=$("#sNome",d).value.trim();
        if(!nome) falha("Informe o nome da subcategoria.");
        var nova = (await API.inserir("fin_subcategorias", { categoria_id:catId, nome:nome }))[0];
        D.subcategorias.push(nova);
      });
  },

  apagarCategoria: async function(b){
    var id=b.dataset.id;
    var usos = D.lancamentos.filter(l=>l.categoria_id===id).length;
    if(usos) return alert("Esta categoria tem "+usos+" lançamento(s) e não pode ser excluída.");
    if(!confirm("Excluir a categoria e suas subcategorias?")) return;
    await API.apagar("fin_categorias", id);
    D.categorias = D.categorias.filter(c=>c.id!==id);
    D.subcategorias = D.subcategorias.filter(s=>s.categoria_id!==id);
    render();
  },

  carregarExemplo: async function(){
    if(!confirm("Carregar dados de exemplo? Eles ficam marcados e podem ser apagados depois.")) return;
    await semearExemplo();
    await carregar();
    render();
  },

  limparExemplo: async function(){
    if(!confirm("Apagar TODOS os dados marcados como exemplo? Seus dados reais não são tocados.")) return;
    for(var i=TABELAS.length-1;i>=0;i--) await API.apagarExemplos(TABELAS[i]);
    await carregar();
    render();
  }
};

/* change em selects/inputs de filtro, mês e seletores */
document.addEventListener("change", function(ev){
  var el = ev.target.closest("[data-act]");
  if(!el) return;
  var act = el.dataset.act;
  if(act==="filtro"){ estado.filtros[el.dataset.k] = el.value; render(); }
  else if(act==="mudarMes"){ estado.mes = el.value || ym(hoje()); render(); }
  else if(act==="trocarCartaoFatura"){ estado.cartaoFatura=el.value; estado.competenciaFatura=null; render(); }
  else if(act==="trocarCompetencia"){ estado.competenciaFatura=el.value; render(); }
});

   Dados de exemplo
=================================================================== */
async function semearExemplo(){
  var contas = await API.inserir("fin_contas", [
    { nome:"Conta corrente", instituicao:"Banco do Brasil", tipo:"corrente", saldo_inicial:4200, ativo:true, exemplo:true },
    { nome:"Poupança", instituicao:"Caixa", tipo:"poupanca", saldo_inicial:12000, ativo:true, exemplo:true }
  ]);
  var cartoes = await API.inserir("fin_cartoes", [
    { nome:"Cartão principal", emissor:"Nubank", limite_total:8000, dia_fechamento:20, dia_vencimento:28, ativo:true, exemplo:true }
  ]);
  var catsR = await API.inserir("fin_categorias", [
    { nome:"Salário", tipo:"receita", exemplo:true },
    { nome:"Freelance", tipo:"receita", exemplo:true }
  ]);
  var catsD = await API.inserir("fin_categorias", [
    { nome:"Moradia", tipo:"despesa", exemplo:true },
    { nome:"Alimentação", tipo:"despesa", exemplo:true },
    { nome:"Transporte", tipo:"despesa", exemplo:true },
    { nome:"Fatura de cartão", tipo:"despesa", exemplo:true }
  ]);
  var subs = await API.inserir("fin_subcategorias", [
    { categoria_id:catsD[0].id, nome:"Aluguel", exemplo:true },
    { categoria_id:catsD[0].id, nome:"Energia", exemplo:true },
    { categoria_id:catsD[1].id, nome:"Supermercado", exemplo:true },
    { categoria_id:catsD[1].id, nome:"Restaurante", exemplo:true }
  ]);

  D.contas = D.contas.concat(contas); D.cartoes = D.cartoes.concat(cartoes);
  D.categorias = D.categorias.concat(catsR, catsD); D.subcategorias = D.subcategorias.concat(subs);

  var hj = hoje(), mes = ym(hj);
  var lancs = [
    { tipo:"receita", forma:"conta", descricao:"Salário", valor:7800, data:mes+"-05",
      categoria_id:catsR[0].id, conta_id:contas[0].id, status:"pago", pago_em:mes+"-05", exemplo:true },
    { tipo:"despesa", forma:"conta", descricao:"Aluguel", valor:2100, data:mes+"-10",
      categoria_id:catsD[0].id, subcategoria_id:subs[0].id, conta_id:contas[0].id, status:"pago", pago_em:mes+"-10", exemplo:true },
    { tipo:"despesa", forma:"conta", descricao:"Conta de energia", valor:280.45, data:mes+"-18",
      categoria_id:catsD[0].id, subcategoria_id:subs[1].id, conta_id:contas[0].id, status:"pendente", exemplo:true }
  ];
  var ins = await API.inserir("fin_lancamentos", lancs);
  D.lancamentos = D.lancamentos.concat(ins);

  // compra parcelada no cartão
  var c = cartoes[0];
  var ciclo = faturaDaCompra(c, mes+"-15");
  var valores = dividirParcelas(1800, 3), compraId = uid(), linhas = [];
  for(var i=0;i<3;i++){
    var cic = i===0 ? ciclo : faturaSeguinte(c, ciclo.competencia, i);
    var fid = await garantirFatura(c, cic);
    linhas.push({ tipo:"despesa", forma:"cartao", descricao:"Notebook", valor:valores[i],
      data: i===0 ? mes+"-15" : cic.fechamento, categoria_id:catsD[2].id, cartao_id:c.id,
      fatura_id:fid, status:"pendente", compra_id:compraId, parcela_num:i+1, parcela_total:3, exemplo:true });
  }
  // compra à vista no cartão
  var fidAv = await garantirFatura(c, ciclo);
  linhas.push({ tipo:"despesa", forma:"cartao", descricao:"Supermercado", valor:430.90, data:mes+"-12",
    categoria_id:catsD[1].id, subcategoria_id:subs[2].id, cartao_id:c.id, fatura_id:fidAv,
    status:"pendente", parcela_num:1, parcela_total:1, exemplo:true });
  var ins2 = await API.inserir("fin_lancamentos", linhas);
  D.lancamentos = D.lancamentos.concat(ins2);

  // recorrência mensal em conta
  var rec = (await API.inserir("fin_recorrencias", {
    tipo:"despesa", forma:"conta", descricao:"Internet", valor:129.90,
    categoria_id:catsD[0].id, conta_id:contas[0].id, dia:15,
    inicio: mes+"-01", fim:null, ativo:true, exemplo:true }))[0];
  D.recorrencias.push(rec);
}

function telaAviso(titulo, texto, extra){
  $("#raiz").innerHTML = '<div style="max-width:560px;margin:10vh auto;padding:0 20px">'+
    '<div class="card"><div class="card-h"><h3>'+esc(titulo)+'</h3></div>'+
    '<div class="card-b"><p style="margin:0 0 12px">'+texto+'</p>'+(extra||"")+'</div></div></div>';
}

async function iniciar(){
  if(USAR_MOCK){
    API = apiMock();
  } else {
    if(!(window.supabase && window.supabase.createClient))
      return telaAviso("Biblioteca não carregou",
        "Não consegui carregar o cliente do banco. Recarregue a página.");
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    var r = await sb.auth.getSession();
    sessao = r && r.data ? r.data.session : null;
    if(!sessao)
      return telaAviso("Entre na sua conta",
        "Este app usa a mesma conta do hub. Abra o <b>RLhub</b> e entre — depois volte aqui.",
        '<a class="btn primary" href="/#/financeiro" style="display:inline-block;line-height:32px;text-decoration:none">Ir para o RLhub</a>');
    API = apiSupabase(sb);
  }

  try{
    await carregar();
  }catch(e){
    return telaAviso("Banco ainda não preparado",
      "Não consegui ler as tabelas <code>fin_*</code>. Rode o arquivo <code>schema.sql</code> "+
      "no SQL Editor do Supabase e recarregue.<br><br><span class='legenda'>"+esc(e.message||e)+"</span>");
  }

  render();

}

iniciar();
</script>
